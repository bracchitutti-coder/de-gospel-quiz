<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evanjelium dňa · Tagesevangelium</title>
<style>
:root {
  --ink-950: #1B2333;
  --ink-900: #232C40;
  --dawn-600: #4A5B82;
  --gold-400: #C9A24B;
  --gold-300: #DDBE76;
  --paper-100: #F2EEE3;
  --paper-050: #FAF8F2;
  --rust-500: #A6483A;
  --rust-100: #F0DAD5;
  --sage-500: #6B8F71;
  --sage-100: #DCE6DD;
  --radius: 14px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper-050);
  color: var(--ink-950);
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.dawn-band {
  height: 156px;
  background: linear-gradient(180deg, var(--ink-950) 0%, var(--dawn-600) 62%, var(--gold-300) 100%);
  position: relative;
  overflow: hidden;
}
.dawn-band::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -60px;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--gold-300) 0%, rgba(221,190,118,0) 70%);
  transform: translateX(-50%);
  opacity: 0.85;
}

.wrap {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 20px 64px;
}

.header-card {
  margin-top: -64px;
  position: relative;
  background: var(--paper-100);
  border-radius: var(--radius);
  padding: 22px 24px 20px;
  box-shadow: 0 12px 32px -12px rgba(27,35,51,0.35);
}

.rubric {
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--rust-500);
}

.feast {
  font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
  font-size: 21px;
  font-weight: 500;
  margin: 6px 0 2px;
  line-height: 1.25;
}

.citation {
  font-size: 13px;
  color: var(--dawn-600);
  font-weight: 600;
}

.section {
  margin-top: 26px;
}

.reread {
  background: var(--paper-100);
  border-radius: var(--radius);
  overflow: hidden;
}

.reread summary {
  cursor: pointer;
  list-style: none;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 600;
  font-size: 14.5px;
}
.reread summary::-webkit-details-marker { display: none; }
.reread summary::after {
  content: "+";
  font-size: 20px;
  color: var(--gold-400);
  font-weight: 400;
  transition: transform 0.2s ease;
}
.reread[open] summary::after { transform: rotate(45deg); }

.reread-body { padding: 0 20px 22px; }

.lang-columns {
  display: flex;
  gap: 24px;
  margin-bottom: 18px;
}
@media (max-width: 640px) {
  .lang-columns { flex-direction: column; gap: 18px; }
}

.lang-block { flex: 1; min-width: 0; }
.lang-block:last-child { margin-bottom: 0; }

.lang-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold-400);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.listen-btn {
  background: none;
  border: 1px solid var(--gold-400);
  border-radius: 20px;
  color: var(--gold-400);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 10px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
  white-space: nowrap;
}
.listen-btn:hover:not(:disabled) {
  background: var(--gold-400);
  color: var(--ink-950);
}
.listen-btn:disabled {
  opacity: 0.5;
  cursor: default;
}
.listen-btn.playing {
  background: var(--gold-400);
  color: var(--ink-950);
}

.gospel-text {
  font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
  font-size: 16.5px;
  line-height: 1.62;
  color: var(--ink-900);
  white-space: pre-line;
}

.vocab-list {
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid rgba(74,91,130,0.18);
}

.vocab-item {
  margin-bottom: 12px;
  font-size: 14px;
  line-height: 1.5;
}
.vocab-item:last-child { margin-bottom: 0; }

.vocab-word {
  font-weight: 700;
  color: var(--ink-950);
}

.vocab-meaning { color: var(--dawn-600); }
.vocab-sk { color: var(--rust-500); font-weight: 500; }

.vocab-note {
  display: block;
  font-size: 12.5px;
  color: var(--rust-500);
  margin-top: 2px;
}

/* Quiz */
.quiz-card {
  background: var(--paper-100);
  border-radius: var(--radius);
  padding: 24px 22px 22px;
  min-height: 340px;
  display: flex;
  flex-direction: column;
}

.progress-row {
  display: flex;
  gap: 6px;
  margin-bottom: 18px;
}
.progress-dot {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: rgba(74,91,130,0.2);
  transition: background 0.25s ease;
}
.progress-dot.done { background: var(--gold-400); }
.progress-dot.current { background: var(--dawn-600); }

.question-text {
  font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
  font-size: 19px;
  font-weight: 500;
  line-height: 1.4;
  margin-bottom: 20px;
}

.options { display: flex; flex-direction: column; gap: 10px; }

.option {
  text-align: left;
  border: 1.5px solid rgba(74,91,130,0.25);
  background: var(--paper-050);
  border-radius: 10px;
  padding: 13px 16px;
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  font-size: 14.5px;
  color: var(--ink-950);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
}
.option:hover:not(:disabled) {
  border-color: var(--gold-400);
}
.option:active:not(:disabled) { transform: scale(0.99); }
.option:disabled { cursor: default; }

.option.correct {
  border-color: var(--sage-500);
  background: var(--sage-100);
  font-weight: 600;
}
.option.incorrect {
  border-color: var(--rust-500);
  background: var(--rust-100);
}

.feedback {
  margin-top: 16px;
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.feedback.correct { color: var(--sage-500); }
.feedback.incorrect { color: var(--rust-500); }

.next-btn {
  margin-top: auto;
  padding-top: 20px;
}
.next-btn button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: var(--ink-950);
  color: var(--paper-100);
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  font-size: 14.5px;
  font-weight: 600;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.next-btn button.visible { opacity: 1; pointer-events: auto; }
.next-btn button:hover { background: var(--dawn-600); }

/* Completion */
.completion {
  text-align: center;
  padding: 8px 4px 4px;
}
.completion-eyebrow {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold-400);
}
.completion-score {
  font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
  font-size: 44px;
  font-weight: 600;
  margin: 10px 0 4px;
  color: var(--ink-950);
}
.completion-msg {
  font-size: 14.5px;
  color: var(--dawn-600);
  margin-bottom: 22px;
  line-height: 1.5;
}
.completion .option { cursor: default; }
.completion .review-label {
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--rust-500);
  margin: 22px 0 10px;
}
.review-q {
  text-align: left;
  font-size: 13.5px;
  margin-bottom: 14px;
  line-height: 1.5;
}
.review-q .q-title { font-weight: 600; margin-bottom: 3px; }
.review-q .q-answer.right { color: var(--sage-500); }
.review-q .q-answer.wrong { color: var(--rust-500); }

.footer-note {
  text-align: center;
  font-size: 12px;
  color: var(--dawn-600);
  margin-top: 28px;
  opacity: 0.75;
}
</style>
</head>
<body>

<div class="dawn-band"></div>

<div class="wrap">

  <div class="header-card">
    <div class="rubric" id="rubric-date"></div>
    <div class="feast" id="feast-name"></div>
    <div class="citation" id="citation-line"></div>
  </div>

  <div class="section">
    <details class="reread" id="reread">
      <summary>Text ešte raz · Text noch einmal lesen</summary>
      <div class="reread-body">
        <div class="lang-columns">
          <div class="lang-block">
            <div class="lang-label">Slovensky</div>
            <div class="gospel-text" id="sk-text"></div>
          </div>
          <div class="lang-block">
            <div class="lang-label">
              Deutsch
              <button class="listen-btn" id="listen-btn" type="button">🔊 Vypočuť</button>
            </div>
            <div class="gospel-text" id="de-text"></div>
          </div>
        </div>
        <div class="vocab-list" id="vocab-list"></div>
      </div>
    </details>
  </div>

  <div class="section">
    <div class="quiz-card" id="quiz-card"></div>
  </div>

  <div class="footer-note">Denné cvičenie nemčiny · Tägliche Deutschübung</div>

</div>

<script>
// --- Day's data: in production this block is templated per day from the
// build_daily_email() payload (gospel_scraper.py + vocab_quiz_generator.py).
// Using the real, tested 8 Feb 2026 output (Mt 5:13-16, salt and light) here.
const DAY = {
  "date": "2026-08-28",
  "feast_sk": "Svätého Augustína, biskupa a učiteľa Cirkvi",
  "citation_sk": "Mt 25, 1-13",
  "citation_de": "Mt 25, 1",
  "sk_text": "Hľa, ženích prichádza, vyjdite mu v ústrety Ježiš povedal svojim učeníkom toto podobenstvo: „Nebeské kráľovstvo sa bude podobať desiatim pannám, ktoré si vzali lampy a vyšli naproti ženíchovi. Päť z nich bolo nerozumných a päť múdrych. Nerozumné si vzali lampy, ale olej si so sebou nevzali. Múdre si vzali s lampami aj olej do nádob. Keď ženích neprichádzal, všetkým sa začalo driemať a zaspali. O polnoci sa strhol krik: ‚Ženích prichádza, vyjdite mu v ústrety!‘ Všetky panny sa prebudili a pripravovali si lampy. Tu nerozumné panny povedali múdrym: ‚Dajte nám zo svojho oleja, lebo naše lampy hasnú.‘ Ale múdre odvetili: ‚Aby azda nebolo ani nám ani vám málo, choďte radšej k predavačom a kúpte si!‘ No kým išli kupovať olej, prišiel ženích a tie, čo boli pripravené, vošli s ním na svadbu a dvere sa zatvorili. Napokon prišli aj ostatné panny a vraveli: ‚Pane, Pane, otvor nám!‘ Ale on im povedal: ‚Veru, hovorím vám: Nepoznám vás.‘ Preto bdejte, lebo neviete ani dňa ani hodiny.“",
  "de_text": "In jener Zeit erzählte Jesus seinen Jüngern das folgende Gleichnis: Mit dem Himmelreich wird es sein wie mit zehn Jungfrauen, die ihre Lampen nahmen und dem Bräutigam entgegengingen. Fünf von ihnen waren töricht und fünf waren klug. Die törichten nahmen ihre Lampen mit, aber kein Öl, die klugen aber nahmen mit ihren Lampen noch Öl in Krügen mit. Als nun der Bräutigam lange nicht kam, wurden sie alle müde und schliefen ein. Mitten in der Nacht aber erscholl der Ruf: Siehe, der Bräutigam! Geht ihm entgegen! Da standen die Jungfrauen alle auf und machten ihre Lampen zurecht. Die törichten aber sagten zu den klugen: Gebt uns von eurem Öl, sonst gehen unsere Lampen aus! Die klugen erwiderten ihnen: Dann reicht es nicht für uns und für euch; geht lieber zu den Händlern und kauft es euch! Während sie noch unterwegs waren, um es zu kaufen, kam der Bräutigam. Die Jungfrauen, die bereit waren, gingen mit ihm in den Hochzeitssaal und die Tür wurde zugeschlossen. Später kamen auch die anderen Jungfrauen und riefen: Herr, Herr, mach uns auf! Er aber antwortete ihnen und sprach: Amen, ich sage euch: Ich kenne euch nicht. Seid also wachsam! Denn ihr wisst weder den Tag noch die Stunde.",
  "vocabulary": [
    {
      "word": "töricht",
      "meaning_sk": "bláznivý, nerozumný, pochabý",
      "meaning_de": "ohne Vernunft handelnd; nicht klug oder bedacht",
      "example": "Es wäre töricht, ohne Vorbereitung in eine wichtige Prüfung zu gehen.",
      "register_note": "Leicht gehoben/literarisch; im Alltag sagt man eher 'dumm', 'unklug' oder 'unvernünftig'."
    },
    {
      "word": "wachsam",
      "meaning_sk": "ostražitý, bdelý, pozorný",
      "meaning_de": "aufmerksam und bereit, auf etwas zu reagieren; gut aufpassen",
      "example": "Man sollte in der Großstadt wachsam sein und auf seine Sachen achten.",
      "register_note": null
    },
    {
      "word": "bereit",
      "meaning_sk": "pripravený, ochotný",
      "meaning_de": "fertig und in der Lage, etwas sofort zu tun",
      "example": "Bist du schon bereit für die Reise morgen früh?",
      "register_note": null
    },
    {
      "word": "erwidern",
      "meaning_sk": "odpovedať, opäť sa ozvať, reagovať",
      "meaning_de": "auf etwas antworten oder reagieren, oft in einem Gespräch",
      "example": "Als sie ihn nach dem Grund fragte, erwiderte er nichts.",
      "register_note": "Etwas formeller als 'antworten'; wird aber auch in modernen Texten und Gesprächen verwendet."
    },
    {
      "word": "ausgehen (Lampe geht aus)",
      "meaning_sk": "zhasnúť, vyhasnúť (svetlo zhasne)",
      "meaning_de": "aufhören zu leuchten oder zu brennen; kein Licht mehr geben",
      "example": "Das Feuer ging aus, weil kein Holz mehr da war.",
      "register_note": null
    }
  ],
  "quiz": [
    {
      "question": "Warum konnten die fünf unvorbereiteten Jungfrauen ihre Lampen nicht weiter brennen lassen?",
      "options": [
        "Ihre Lampen waren kaputt und ließen sich nicht reparieren.",
        "Sie hatten kein zusätzliches Öl mitgenommen.",
        "Sie haben das Öl verschüttet, als sie eingeschlafen sind.",
        "Der Bräutigam hatte ihr Öl weggenommen."
      ],
      "correct_index": 1
    },
    {
      "question": "Was passierte, während die törichten Jungfrauen losgingen, um Öl zu kaufen?",
      "options": [
        "Die klugen Jungfrauen schenkten ihnen etwas von ihrem Öl.",
        "Der Bräutigam wartete geduldig auf alle zehn.",
        "Der Bräutigam kam an und trat mit den vorbereiteten Jungfrauen in den Hochzeitssaal ein.",
        "Die Tür blieb offen, damit auch die anderen noch hineinkommen konnten."
      ],
      "correct_index": 2
    },
    {
      "question": "Warum gaben die klugen Jungfrauen den törichten kein Öl ab?",
      "options": [
        "Sie wollten den anderen aus Bosheit nicht helfen.",
        "Sie hatten selbst nicht genug Öl für alle zusammen.",
        "Die Händler hatten ihnen verboten, das Öl weiterzugeben.",
        "Sie schliefen noch und hörten die Bitte nicht."
      ],
      "correct_index": 1
    },
    {
      "question": "Was antwortete der Bräutigam, als die verspäteten Jungfrauen an die Tür klopften?",
      "options": [
        "Er ließ sie nach einer kurzen Erklärung doch noch herein.",
        "Er bat sie, bis zum nächsten Morgen zu warten.",
        "Er sagte, er kenne sie nicht, und öffnete nicht.",
        "Er schickte die klugen Jungfrauen, um ihnen zu helfen."
      ],
      "correct_index": 2
    },
    {
      "question": "Welche Botschaft vermittelt das Gleichnis am Ende direkt an die Zuhörer?",
      "options": [
        "Man soll immer genug Vorräte für den Winter kaufen.",
        "Man soll wachsam sein, weil man den genauen Zeitpunkt nicht kennt.",
        "Man soll anderen helfen, auch wenn man selbst wenig hat.",
        "Man soll früh schlafen gehen, um ausgeruht zu sein."
      ],
      "correct_index": 1
    }
  ]
};

// --- Header ---
function formatDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('sk-SK', { day: 'numeric', month: 'long', year: 'numeric' });
}
document.getElementById('rubric-date').textContent = formatDate(DAY.date);
document.getElementById('feast-name').textContent = DAY.feast_sk;
document.getElementById('citation-line').textContent = DAY.citation_sk + "  ·  " + DAY.citation_de;
document.getElementById('sk-text').textContent = DAY.sk_text;
document.getElementById('de-text').textContent = DAY.de_text;

const vocabList = document.getElementById('vocab-list');
DAY.vocabulary.forEach(v => {
  const div = document.createElement('div');
  div.className = 'vocab-item';
  div.innerHTML = `<span class="vocab-word">${v.word}</span>` +
    (v.meaning_sk ? ` <span class="vocab-sk">(${v.meaning_sk})</span>` : '') +
    ` — <span class="vocab-meaning">${v.meaning_de}</span>` +
    (v.register_note ? `<span class="vocab-note">${v.register_note}</span>` : '');
  vocabList.appendChild(div);
});

// --- Quiz state machine ---
const quizCard = document.getElementById('quiz-card');
let current = 0;
let answered = false;
let selectedIndex = null;
const results = new Array(DAY.quiz.length).fill(null);

function renderProgress() {
  let html = '<div class="progress-row">';
  for (let i = 0; i < DAY.quiz.length; i++) {
    let cls = 'progress-dot';
    if (i < current) cls += ' done';
    else if (i === current) cls += ' current';
    html += `<div class="${cls}"></div>`;
  }
  html += '</div>';
  return html;
}

function renderQuestion() {
  answered = false;
  selectedIndex = null;
  const q = DAY.quiz[current];
  let html = renderProgress();
  html += `<div class="question-text">${q.question}</div>`;
  html += '<div class="options">';
  q.options.forEach((opt, i) => {
    html += `<button class="option" data-index="${i}">${opt}</button>`;
  });
  html += '</div>';
  html += '<div id="feedback-slot"></div>';
  html += '<div class="next-btn"><button id="next-question-btn">Ďalej · Weiter</button></div>';
  quizCard.innerHTML = html;

  quizCard.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.index)));
  });
  document.getElementById('next-question-btn').addEventListener('click', goNext);
}

function selectAnswer(index) {
  if (answered) return;
  answered = true;
  selectedIndex = index;
  const q = DAY.quiz[current];
  results[current] = index === q.correct_index;

  quizCard.querySelectorAll('.option').forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correct_index) btn.classList.add('correct');
    else if (i === index) btn.classList.add('incorrect');
  });

  const slot = document.getElementById('feedback-slot');
  if (results[current]) {
    slot.innerHTML = '<div class="feedback correct">Správne! · Richtig!</div>';
  } else {
    slot.innerHTML = '<div class="feedback incorrect">Nesprávne · Nicht ganz — die richtige Antwort ist markiert.</div>';
  }

  document.getElementById('next-question-btn').classList.add('visible');
}

function goNext() {
  if (current < DAY.quiz.length - 1) {
    current++;
    renderQuestion();
  } else {
    renderCompletion();
  }
}

function renderCompletion() {
  const score = results.filter(Boolean).length;
  const total = DAY.quiz.length;
  let msg;
  if (score === total) msg = "Rozumieš dnešnému evanjeliu veľmi dobre. · Du hast das heutige Evangelium sehr gut verstanden.";
  else if (score >= total / 2) msg = "Dobrá práca. Zajtra znova. · Gute Arbeit. Bis morgen wieder.";
  else msg = "Skús si text ešte raz prečítať vyššie. · Lies den Text oben noch einmal.";

  let html = `<div class="completion">
    <div class="completion-eyebrow">Dnešný výsledok · Heutiges Ergebnis</div>
    <div class="completion-score">${score}/${total}</div>
    <div class="completion-msg">${msg}</div>
    <div class="review-label">Prehľad · Übersicht</div>`;

  DAY.quiz.forEach((q, i) => {
    const right = results[i];
    html += `<div class="review-q">
      <div class="q-title">${q.question}</div>
      <div class="q-answer ${right ? 'right' : 'wrong'}">${q.options[q.correct_index]}</div>
    </div>`;
  });

  html += `</div>`;
  quizCard.innerHTML = html;
}

renderQuestion();

// --- Read-aloud (browser built-in speech synthesis, no external service) ---
const listenBtn = document.getElementById('listen-btn');
let currentUtterance = null;

function pickGermanVoice() {
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.lang === 'de-DE')
      || voices.find(v => v.lang && v.lang.startsWith('de'))
      || null;
}

if (!('speechSynthesis' in window)) {
  listenBtn.disabled = true;
  listenBtn.textContent = '🔇 Nedostupné';
} else {
  listenBtn.addEventListener('click', () => {
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
      listenBtn.classList.remove('playing');
      listenBtn.textContent = '🔊 Vypočuť';
      return;
    }
    const utterance = new SpeechSynthesisUtterance(DAY.de_text);
    utterance.lang = 'de-DE';
    const voice = pickGermanVoice();
    if (voice) utterance.voice = voice;
    utterance.rate = 0.92;

    utterance.onstart = () => {
      listenBtn.classList.add('playing');
      listenBtn.textContent = '⏸ Zastaviť';
    };
    utterance.onend = utterance.onerror = () => {
      listenBtn.classList.remove('playing');
      listenBtn.textContent = '🔊 Vypočuť';
    };

    currentUtterance = utterance;
    window.speechSynthesis.speak(utterance);
  });
}
</script>

</body>
</html>
